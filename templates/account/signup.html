<!DOCTYPE html>
{% extends "_base.html" %}

{% load crispy_forms_tags %}
{% block title %}Sign Up{% endblock title %}
{% block content %}
<div class="container ">
    <div class="row justify-content-center py-3">

        <div class="col-12 col-md-6 col-lg-4 bg-light pb-2" style="border-radius:20px;">
            <h2>Sign Up</h2>
            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <button class="btn btn-success d-flex mx-auto" type="submit">Sign Up</button>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
